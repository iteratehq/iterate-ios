name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -workspace Iterate.xcworkspace -scheme IterateSDK

      - name: Build & Test
        run: |
          xcodebuild test \
            -workspace Iterate.xcworkspace \
            -scheme IterateSDK \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
