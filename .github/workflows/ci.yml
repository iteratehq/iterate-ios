name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -workspace Iterate.xcworkspace -scheme IterateSDK

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -workspace Iterate.xcworkspace \
            -scheme IterateSDK \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \
            -quiet

      - name: Test
        run: |
          xcodebuild test-without-building \
            -workspace Iterate.xcworkspace \
            -scheme IterateSDK \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \
            -quiet
